<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Hermes Virtual Office</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #58a6ff;
    --green: #3fb950;
    --yellow: #d29922;
    --red: #f85149;
    --purple: #bc8cff;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, monospace;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    padding: 12px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
  }

  header h1 { font-size: 16px; font-weight: 600; }
  header .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); animation: pulse 2s infinite; }

  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

  main {
    display: grid;
    grid-template-columns: 1fr 320px;
    flex: 1;
    overflow: hidden;
  }

  /* Canvas Office */
  #office-container {
    position: relative;
    background: var(--panel);
    border-right: 1px solid var(--border);
    overflow: hidden;
  }

  canvas#office { display: block; width: 100%; height: 100%; }

  /* Sidebar */
  aside {
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .panel-title {
    padding: 12px 16px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--muted);
    border-bottom: 1px solid var(--border);
  }

  /* Agent Cards */
  #agent-list {
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex: 1;
    overflow-y: auto;
  }

  .agent-card {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    cursor: pointer;
    transition: border-color .2s;
  }
  .agent-card:hover { border-color: var(--accent); }
  .agent-card.selected { border-color: var(--accent); }

  .agent-header { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .agent-avatar { width: 28px; height: 28px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 14px; }
  .agent-name { font-size: 13px; font-weight: 600; }
  .agent-role { font-size: 11px; color: var(--muted); margin-bottom: 6px; }
  .agent-log { font-size: 11px; color: var(--muted); font-style: italic; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .state-badge {
    margin-left: auto;
    padding: 2px 7px;
    border-radius: 20px;
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .06em;
  }
  .state-IDLE { background: #30363d; color: var(--muted); }
  .state-THINKING { background: rgba(210,153,34,.2); color: var(--yellow); }
  .state-EXECUTING { background: rgba(63,185,80,.15); color: var(--green); }
  .state-DONE { background: rgba(88,166,255,.15); color: var(--accent); }

  /* Task Panel */
  #task-panel {
    border-top: 1px solid var(--border);
    padding: 12px;
  }

  #task-panel select, #task-panel input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 7px 10px;
    color: var(--text);
    font-size: 12px;
    margin-bottom: 8px;
    outline: none;
  }
  #task-panel select:focus, #task-panel input:focus { border-color: var(--accent); }

  #task-panel button {
    width: 100%;
    background: var(--accent);
    color: #0d1117;
    font-weight: 700;
    border: none;
    border-radius: 6px;
    padding: 8px;
    font-size: 13px;
    cursor: pointer;
  }
  #task-panel button:hover { opacity: .85; }

  /* Activity Log */
  #activity-log {
    border-top: 1px solid var(--border);
  }
  #log-list {
    height: 120px;
    overflow-y: auto;
    padding: 8px 12px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .log-entry { font-size: 11px; color: var(--muted); }
  .log-entry span { color: var(--accent); }

</style>
</head>
<body>
<header>
  <div class="dot"></div>
  <h1>🏢 Hermes Virtual Office</h1>
  <small style="color:var(--muted);margin-left:auto">AI Agents — Real-time Dashboard</small>
</header>
<main>
  <div id="office-container">
    <canvas id="office"></canvas>
  </div>
  <aside>
    <div class="panel-title">Agents</div>
    <div id="agent-list"></div>

    <div id="task-panel">
      <div class="panel-title" style="margin-bottom:8px;padding:0">Dispatch Task</div>
      <select id="agent-select"></select>
      <input id="task-input" type="text" placeholder="Describe the task..." />
      <button onclick="dispatchTask()">▶ Run</button>
    </div>

    <div id="activity-log">
      <div class="panel-title">Activity Log</div>
      <div id="log-list"></div>
    </div>
  </aside>
</main>
<script src="app.js"></script>
</body>
</html>
