<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Hermes Virtual Office</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #58a6ff;
    --green: #3fb950;
    --yellow: #d29922;
    --red: #f85149;
    --purple: #bc8cff;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, monospace;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    padding: 12px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
  }

  header h1 { font-size: 16px; font-weight: 600; }
  header .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); animation: pulse 2s infinite; }

  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

  main {
    display: grid;
    grid-template-columns: 1fr 320px;
    flex: 1;
    overflow: hidden;
  }

  /* Canvas Office */
  #office-container {
    position: relative;
    background: var(--panel);
    border-right: 1px solid var(--border);
    overflow: hidden;
  }

  canvas#office { display: block; width: 100%; height: 100%; }

  /* Sidebar */
  aside {
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .panel-title {
    padding: 12px 16px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--muted);
    border-bottom: 1px solid var(--border);
  }

  /* Agent Cards */
  #agent-list {
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex: 1;
    overflow-y: auto;
  }

  .agent-card {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    cursor: pointer;
    transition: border-color .2s;
  }
  .agent-card:hover { border-color: var(--accent); }
  .agent-card.selected { border-color: var(--accent); }

  .agent-header { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
</style>
</head>
<body>
<header><span class="dot"></span><h1>Hermes Virtual Office</h1></header>
<main>
  <div id="office-container"><canvas id="office"></canvas></div>
  <aside>
    <div class="panel-title">Agents</div>
    <div id="agent-list"></div>

    <div id="task-panel">
      <div class="panel-title" style="margin-bottom:8px;padding:0">Dispatch Task</div>
      <select id="agent-select"></select>
      <input id="task-input" type="text" placeholder="Describe the task..." />
      <button onclick="dispatchTask()">▶ Run</button>
    </div>

    <div id="activity-log">
      <div class="panel-title">Activity Log</div>
      <div id="log-list"></div>
    </div>
  </aside>
</main>
<script src="app.js"></script>
<script src="office.js"></script>
</body>
</html>
