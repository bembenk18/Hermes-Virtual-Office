<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Hermes Virtual Office</title>
<style>
  :root {
    --bg: #0a0e18;
    --panel: #0f1629;
    --card: #131d33;
    --border: #1e2d4a;
    --text: #e2e8f0;
    --muted: #64748b;
    --accent: #3b82f6;
    --green: #22c55e;
    --yellow: #eab308;
    --red: #ef4444;
    --purple: #a855f7;
    --orange: #f97316;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'SF Mono', 'Fira Code', monospace;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Header */
  header {
    padding: 10px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--panel);
    flex-shrink: 0;
  }

  .logo {
    font-size: 14px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: .04em;
  }
  .logo span { color: var(--accent); }

  .status-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--green);
    animation: blink 2s steps(1) infinite;
  }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.2} }

  .header-tags {
    display: flex;
    gap: 6px;
    margin-left: auto;
  }
  .tag {
    padding: 2px 8px;
    border-radius: 20px;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: .05em;
    text-transform: uppercase;
    border: 1px solid;
  }
  .tag-green { background: rgba(34,197,94,.1); color: var(--green); border-color: rgba(34,197,94,.3); }
  .tag-blue  { background: rgba(59,130,246,.1); color: var(--accent); border-color: rgba(59,130,246,.3); }

  /* Main Layout */
  main {
    display: grid;
    grid-template-columns: 1fr 300px;
    flex: 1;
    overflow: hidden;
  }

  /* Canvas */
  #office-container {
    position: relative;
    background: #060c18;
    overflow: hidden;
  }
  canvas#office { display: block; width: 100%; height: 100%; }

  /* Sidebar */
  aside {
    background: var(--panel);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .section-title {
    padding: 10px 14px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--muted);
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    flex-shrink: 0;
  }

  /* Agent Cards */
  #agent-list {
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    overflow-y: auto;
    flex: 1;
    min-height: 0;
  }

  .agent-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    cursor: pointer;
    transition: border-color .15s;
    font-size: 12px;
  }
  .agent-card:hover { border-color: var(--accent); }

  .agent-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 4px;
  }

  .agent-icon {
    width: 26px; height: 26px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }

  .agent-name { font-weight: 600; font-size: 12px; color: var(--text); }
  .agent-role { font-size: 10px; color: var(--muted); }
  .agent-log  { font-size: 10px; color: var(--muted); font-style: italic;
                 white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .state-badge {
    margin-left: auto;
    padding: 2px 8px;
    border-radius: 20px;
    font-size: 9px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .07em;
    flex-shrink: 0;
  }
  .state-IDLE      { background: rgba(100,116,139,.15); color: #94a3b8; }
  .state-THINKING  { background: rgba(234,179,8,.15);   color: var(--yellow); }
  .state-EXECUTING { background: rgba(34,197,94,.15);   color: var(--green); }
  .state-DONE      { background: rgba(59,130,246,.15);  color: var(--accent); }

  /* Dispatch Panel */
  #dispatch-panel {
    border-top: 1px solid var(--border);
    padding: 12px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    gap: 7px;
  }

  #dispatch-panel select,
  #dispatch-panel input {
    width: 100%;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 7px 10px;
    color: var(--text);
    font-size: 11px;
    font-family: inherit;
    outline: none;
    transition: border-color .15s;
  }
  #dispatch-panel select:focus,
  #dispatch-panel input:focus { border-color: var(--accent); }

  .btn-row { display: flex; gap: 6px; }

  .btn {
    flex: 1;
    border: none;
    border-radius: 6px;
    padding: 7px 10px;
    font-size: 11px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    transition: opacity .15s;
  }
  .btn:hover { opacity: .85; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-ghost   { background: var(--card); color: var(--muted); border: 1px solid var(--border); }

  /* Activity Log */
  #activity-log {
    border-top: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    max-height: 130px;
    flex-shrink: 0;
  }
  #log-list {
    overflow-y: auto;
    padding: 8px 12px;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .log-entry {
    font-size: 10px;
    color: var(--muted);
    font-family: inherit;
  }
  .log-entry .log-time { color: var(--border); margin-right: 6px; }
  .log-entry .log-name { color: var(--accent); }
</style>
</head>
<body>
<header>
  <div class="status-dot"></div>
  <div class="logo"><span>⬡</span> Hermes Virtual Office</div>
  <div class="header-tags">
    <span class="tag tag-green">4 Agents</span>
    <span class="tag tag-blue">Live</span>
  </div>
</header>
<main>
  <div id="office-container"><canvas id="office"></canvas></div>
  <aside>
    <div class="section-title">Agents</div>
    <div id="agent-list"></div>

    <div id="dispatch-panel">
      <div class="section-title" style="padding:0 0 8px;border:none">Dispatch Task</div>
      <select id="agent-select"></select>
      <input id="task-input" type="text" placeholder="Describe the task…" />
      <div class="btn-row">
        <button class="btn btn-ghost" onclick="clearTask()">Clear</button>
        <button class="btn btn-primary" onclick="dispatchTask()">▶ Run</button>
      </div>
    </div>

    <div id="activity-log">
      <div class="section-title">Activity Log</div>
      <div id="log-list"></div>
    </div>
  </aside>
</main>
<script src="app.js"></script>
<script src="office.js"></script>
</body>
</html>
